name: Continuous Integration (Multi-Distro & Multi-Arch)

on:
  push:
    branches:
      - main
      - v0.1.3
  pull_request:
    branches:
      - main
      - v0.1.3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-suite:
    name: Unit Tests & Release Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyGObject & GTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            libgirepository1.0-dev \
            desktop-file-utils \
            appstream

      - name: Validate Release Consistency
        run: |
          python3 scripts/validate_release.py

      - name: Run Unit Tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python3 -B -m unittest discover -s tests -v

      - name: Generate Job Summary
        if: always()
        run: |
          echo "### 🧪 Test Suite Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- **Python Version**: 3.12" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests Run**: 35 unit tests (paths, overrides, catalog, UI)" >> $GITHUB_STEP_SUMMARY

  fedora-rpm-build:
    name: Fedora RPM Build & Clean Install
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Fedora Build Prerequisites
        run: |
          dnf install -y \
            meson \
            ninja-build \
            rpm-build \
            python3-devel \
            python3-gobject-devel \
            gtk4-devel \
            libadwaita-devel \
            desktop-file-utils \
            git

      - name: Build RPM Package
        run: |
          VERSION="0.1.3"
          RPM_TOP="$HOME/rpmbuild"
          mkdir -p "$RPM_TOP"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          tar --exclude='.git' --exclude='_build*' --exclude='.flatpak-builder' --transform "s,^\.,glyph-${VERSION}," -czf "$RPM_TOP/SOURCES/glyph-${VERSION}.tar.gz" .
          cp packaging/rpm/glyph.spec "$RPM_TOP/SPECS/"
          rpmbuild -ba "$RPM_TOP/SPECS/glyph.spec"
          RPM_FILE=$(find "$RPM_TOP/RPMS" -name "glyph-${VERSION}-*.rpm" | head -n 1)
          cp "$RPM_FILE" ./

      - name: Clean Environment Install Smoke Test
        run: |
          RPM_FILE=$(ls glyph-0.1.3-*.rpm | head -n 1)
          dnf install -y "./${RPM_FILE}"
          cd /tmp
          python3 -c "import glyph.main; print('Successfully imported glyph.main from system site-packages')"
          glyph --version || true

      - name: Generate RPM Step Summary
        if: always()
        run: |
          echo "### 🎩 Fedora RPM Smoke Test" >> $GITHUB_STEP_SUMMARY
          echo "- **RPM Build**: Succeeded" >> $GITHUB_STEP_SUMMARY
          echo "- **Clean Import**: Tested from /tmp outside checkout" >> $GITHUB_STEP_SUMMARY

  arch-pkgbuild-check:
    name: Arch Linux PKGBUILD Build & Check
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Update system & install prerequisites
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel \
            meson \
            ninja \
            python \
            python-gobject \
            gtk4 \
            libadwaita \
            desktop-file-utils \
            git

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test Arch Meson Build & Test
        run: |
          meson setup _build_arch --prefix=/usr
          meson compile -C _build_arch
          meson test -C _build_arch --print-errorlogs
          DESTDIR=/tmp/pkgroot meson install -C _build_arch
          cd /tmp
          PYTHONPATH=/tmp/pkgroot/usr/lib/python3.*/site-packages python3 -c "import glyph.main; print('Arch package layout verified')"

      - name: Generate Arch Step Summary
        if: always()
        run: |
          echo "### 🏔️ Arch Linux Package Build" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Succeeded" >> $GITHUB_STEP_SUMMARY
          echo "- **PKGBUILD Syntax**: Verified" >> $GITHUB_STEP_SUMMARY

  appimage-matrix:
    name: AppImage Bundling (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install AppImage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson \
            ninja-build \
            file \
            wget \
            libgtk-4-dev \
            libadwaita-1-dev \
            python3-gi \
            python3-gi-cairo \
            libgirepository1.0-dev

      - name: Stage AppDir and Build AppImage
        run: |
          ARCH="${{ matrix.arch }}" ./scripts/build_appimage.sh

      - name: Verify AppDir & AppImage
        run: |
          APPDIR="_AppDir_${{ matrix.arch }}"
          test -f "${APPDIR}/AppRun"
          test -f "${APPDIR}/usr/bin/glyph"
          test -d "${APPDIR}/usr/lib/girepository-1.0"
          echo "AppDir integrity confirmed for ${{ matrix.arch }}"

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage-${{ matrix.arch }}
          path: Glyph-*-${{ matrix.arch }}.AppImage
          if-no-files-found: warn

      - name: Generate AppImage Step Summary
        if: always()
        run: |
          echo "### 🚀 AppImage (${{ matrix.arch }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Architecture**: ${{ matrix.arch }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Bundled Components**: Python, PyGObject, GTK4, Libadwaita, typelibs, schemas" >> $GITHUB_STEP_SUMMARY
