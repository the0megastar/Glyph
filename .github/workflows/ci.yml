name: Continuous Integration (Multi-Distro & Multi-Arch)

on:
  push:
    branches:
      - main
      - v0.1.3
  pull_request:
    branches:
      - main
      - v0.1.3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-suite:
    name: Unit Tests & Release Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PyGObject & GTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            libgirepository1.0-dev \
            desktop-file-utils \
            appstream

      - name: Validate Release Consistency
        run: |
          python3 scripts/validate_release.py

      - name: Run Unit Tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python3 -B -m unittest discover -s tests -v

      - name: Generate Job Summary
        if: always()
        run: |
          echo "### 🧪 Test Suite Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- **Python Version**: 3.12" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests Run**: 50 unit tests (paths, overrides, catalog, UI)" >> $GITHUB_STEP_SUMMARY

  flatpak-lint:
    name: Flatpak Manifest & Flathub Quality Check
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-builder-lint:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint Flatpak Manifest
        run: |
          flatpak-builder-lint --exceptions --user-exceptions packaging/flatpak/exceptions.json manifest io.github.the0megastar.Glyph.yaml

      - name: Validate AppStream Metadata & Desktop File
        run: |
          desktop-file-validate data/io.github.the0megastar.Glyph.desktop
          appstreamcli validate --no-net data/io.github.the0megastar.Glyph.metainfo.xml

      - name: Generate Flatpak Step Summary
        if: always()
        run: |
          echo "### 📦 Flatpak & Flathub Quality Gate" >> $GITHUB_STEP_SUMMARY
          echo "- **Manifest**: Validated against Flathub standards" >> $GITHUB_STEP_SUMMARY
          echo "- **Desktop File**: desktop-file-validate passed" >> $GITHUB_STEP_SUMMARY
          echo "- **AppStream Metainfo**: appstreamcli validate passed" >> $GITHUB_STEP_SUMMARY

  fedora-rpm-build:
    name: Fedora RPM Build & Clean Install
    uses: ./.github/workflows/rpm.yml

  debian-deb-build:
    name: Debian / Ubuntu .deb Build & Clean Install
    uses: ./.github/workflows/deb.yml

  arch-pkgbuild-check:
    name: Arch Linux PKGBUILD Build & Check
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Update system & install prerequisites
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel \
            meson \
            ninja \
            python \
            python-gobject \
            gtk4 \
            libadwaita \
            desktop-file-utils \
            git

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test Arch Meson Build & Test
        run: |
          meson setup _build_arch --prefix=/usr
          meson compile -C _build_arch
          meson test -C _build_arch --print-errorlogs
          DESTDIR=/tmp/pkgroot meson install -C _build_arch
          cd /tmp
          SITE_DIR=$(echo /tmp/pkgroot/usr/lib/python3.*/site-packages)
          PYTHONPATH="$SITE_DIR" python3 -c "import glyph.main; print('Arch package layout verified')"

      - name: Generate Arch Step Summary
        if: always()
        run: |
          echo "### 🏔️ Arch Linux Package Build" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Succeeded" >> $GITHUB_STEP_SUMMARY
          echo "- **PKGBUILD Syntax**: Verified" >> $GITHUB_STEP_SUMMARY

  appimage-matrix:
    name: AppImage Bundling (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install AppImage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson \
            ninja-build \
            file \
            wget \
            libgtk-4-dev \
            libadwaita-1-dev \
            python3-gi \
            python3-gi-cairo \
            libgirepository1.0-dev

      - name: Stage AppDir and Build AppImage
        run: |
          ARCH="${{ matrix.arch }}" ./scripts/build_appimage.sh

      - name: Verify AppDir & AppImage
        run: |
          APPDIR="_AppDir_${{ matrix.arch }}"
          test -f "${APPDIR}/AppRun"
          test -f "${APPDIR}/usr/bin/glyph"
          test -d "${APPDIR}/usr/lib/girepository-1.0"
          echo "AppDir integrity confirmed for ${{ matrix.arch }}"

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage-${{ matrix.arch }}
          path: Glyph-*-${{ matrix.arch }}.AppImage
          if-no-files-found: warn

      - name: Generate AppImage Step Summary
        if: always()
        run: |
          echo "### 🚀 AppImage (${{ matrix.arch }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Architecture**: ${{ matrix.arch }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Format**: Portable Distro-Agnostic AppImage with PNG .DirIcon and pre-flight environment validation" >> $GITHUB_STEP_SUMMARY
