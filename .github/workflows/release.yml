name: Release Packages (Multi-Arch)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-test:
    name: Validate & Run Test Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            libgirepository1.0-dev \
            desktop-file-utils \
            appstream

      - name: Validate Release Version & Metadata
        run: |
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            python3 scripts/validate_release.py --tag "${GITHUB_REF_NAME}"
          else
            python3 scripts/validate_release.py
          fi

      - name: Run Unit Tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python3 -B -m unittest discover -s tests -v

  build-flatpak:
    name: Build Flatpak Bundle (${{ matrix.arch }})
    needs: [validate-and-test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flatpak & Flatpak Builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Configure Flathub Remote
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install GNOME Platform & SDK Runtime
        run: |
          flatpak install --user -y flathub org.gnome.Platform//50 org.gnome.Sdk//50

      - name: Build Flatpak App & Repository
        run: |
          flatpak-builder --user --install-deps-from=flathub --force-clean --repo=repo build-dir io.github.the0megastar.Glyph.yaml

      - name: Export Single-File Flatpak Bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION=$(PYTHONPATH=src python3 -c "import glyph; print(glyph.__version__)")
          fi
          flatpak build-bundle --arch=${{ matrix.arch }} repo "Glyph-${VERSION}-${{ matrix.arch }}.flatpak" io.github.the0megastar.Glyph

      - name: Upload Flatpak Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.arch }}
          path: Glyph-*.flatpak

  build-deb:
    name: Build Debian Package (.deb)
    needs: [validate-and-test]
    uses: ./.github/workflows/deb.yml

  build-rpm:
    name: Build Fedora RPM (.rpm)
    needs: [validate-and-test]
    uses: ./.github/workflows/rpm.yml

  build-appimage:
    name: Build AppImage (${{ matrix.arch }})
    needs: [validate-and-test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools & dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson \
            ninja-build \
            file \
            wget \
            libgtk-4-dev \
            libadwaita-1-dev \
            python3-gi \
            python3-gi-cairo \
            libgirepository1.0-dev

      - name: Build Real Runtime AppImage
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION=$(PYTHONPATH=src python3 -c "import glyph; print(glyph.__version__)")
          fi
          ARCH="${{ matrix.arch }}" VERSION="${VERSION}" ./scripts/build_appimage.sh
          test -s "Glyph-${VERSION}-${{ matrix.arch }}.AppImage"

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage-${{ matrix.arch }}
          path: Glyph-*-${{ matrix.arch }}.AppImage
          if-no-files-found: error

  build-arch:
    name: Build Arch Package
    needs: [validate-and-test]
    uses: ./.github/workflows/arch.yml

  publish-release:
    name: Publish Release Assets
    needs: [build-flatpak, build-deb, build-rpm, build-appimage, build-arch]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
          pattern: "{flatpak-*,appimage-*,native-*}"

      - name: Verify Complete Release Asset Set
        env:
          ARCH_PACKAGE: ${{ needs.build-arch.outputs.package }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION=$(PYTHONPATH=src python3 -c "import glyph; print(glyph.__version__)")
          fi
          PKGREL=$(sed -n 's/^pkgrel=//p' packaging/aur/PKGBUILD)
          test "$ARCH_PACKAGE" = "glyph-${VERSION}-${PKGREL}-any.pkg.tar.zst"
          echo "Verifying release assets for version: ${VERSION}"
          for asset in \
            "Glyph-${VERSION}-x86_64.flatpak" \
            "Glyph-${VERSION}-aarch64.flatpak" \
            "Glyph-${VERSION}-x86_64.AppImage" \
            "Glyph-${VERSION}-aarch64.AppImage" \
            "glyph-${VERSION}.deb" \
            "glyph-${VERSION}.rpm" \
            "$ARCH_PACKAGE"; do
            test -s "release-assets/${asset}" || { echo "Missing or empty release asset: release-assets/${asset}" >&2; exit 1; }
          done
          ls -lh release-assets/

      - name: Write Release Step Summary
        run: |
          echo "### 📦 Release Binaries Published" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Target | Architecture |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          for f in release-assets/*; do
            filename=$(basename "$f")
            echo "| \`$filename\` | Release Asset | Multi |" >> $GITHUB_STEP_SUMMARY
          done

      - name: Determine Release Notes Path
        id: release_notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION=$(PYTHONPATH=src python3 -c "import glyph; print(glyph.__version__)")
          fi
          if [ -f "docs/RELEASE_v${VERSION}.md" ]; then
            echo "path=docs/RELEASE_v${VERSION}.md" >> "$GITHUB_OUTPUT"
          elif [ -f "docs/RELEASE_${VERSION}.md" ]; then
            echo "path=docs/RELEASE_${VERSION}.md" >> "$GITHUB_OUTPUT"
          elif [ -f "docs/RELEASE_v0.1.3.md" ]; then
            echo "path=docs/RELEASE_v0.1.3.md" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Release Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          body_path: ${{ steps.release_notes.outputs.path }}
          draft: false
          prerelease: false
          generate_release_notes: true
