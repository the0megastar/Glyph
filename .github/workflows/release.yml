name: Release Packages (Multi-Arch)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-test:
    name: Validate & Run Test Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            libgirepository1.0-dev \
            desktop-file-utils \
            appstream

      - name: Validate Release Version & Metadata
        run: |
          python3 scripts/validate_release.py --tag "${GITHUB_REF_NAME:-}"

      - name: Run Unit Tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python3 -B -m unittest discover -s tests -v

  build-flatpak:
    name: Build Flatpak Bundle (${{ matrix.arch }})
    needs: [validate-and-test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flatpak & Flatpak Builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Configure Flathub Remote
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install GNOME Platform & SDK Runtime
        run: |
          flatpak install --user -y flathub org.gnome.Platform//50 org.gnome.Sdk//50

      - name: Build Flatpak App & Repository
        run: |
          flatpak-builder --user --install-deps-from=flathub --force-clean --repo=repo build-dir io.github.the0megastar.Glyph.yaml

      - name: Export Single-File Flatpak Bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION=$(PYTHONPATH=src python3 -c "import glyph; print(glyph.__version__)")
          fi
          flatpak build-bundle --arch=${{ matrix.arch }} repo "Glyph-${VERSION}-${{ matrix.arch }}.flatpak" io.github.the0megastar.Glyph

      - name: Upload Flatpak Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.arch }}
          path: Glyph-*.flatpak

  build-deb-rpm:
    name: Build Native Packages (.deb & .rpm)
    needs: [validate-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools & dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson \
            ninja-build \
            rpm \
            python3-all \
            python-gi-dev \
            python3-gi \
            python3-gi-cairo \
            libgirepository1.0-dev \
            libgtk-4-dev \
            libadwaita-1-dev \
            desktop-file-utils

      - name: Stage Meson installation
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION=$(PYTHONPATH=src python3 -c "import glyph; print(glyph.__version__)")
          fi
          echo "PACKAGING_VERSION=$VERSION" >> $GITHUB_ENV
          
          meson setup _build --prefix=/usr
          DESTDIR="$(pwd)/_pkg_root" meson install -C _build

      - name: Build Debian Packages (.deb)
        run: |
          VERSION="${PACKAGING_VERSION:?PACKAGING_VERSION was not set}"
          DEB_DIR="$(pwd)/_deb_root"
          mkdir -p "$DEB_DIR"
          cp -r _pkg_root/* "$DEB_DIR/"
          mkdir -p "$DEB_DIR/DEBIAN"

          cat <<EOF > "$DEB_DIR/DEBIAN/control"
          Package: glyph
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: all
          Maintainer: the0megastar <https://github.com/the0megastar/Glyph>
          Depends: python3 (>= 3.10), python3-gi, gir1.2-gtk-4.0 (>= 4.10), gir1.2-adw-1 (>= 1.5), desktop-file-utils
          Description: Customize application launcher icons and names on Linux
           A modern desktop utility for Linux to browse installed applications,
           customize launcher icons and display names safely at the user level,
           and easily restore system defaults.
          EOF

          cat <<'EOF' > "$DEB_DIR/DEBIAN/postinst"
          #!/bin/sh
          set -e
          if [ -x /usr/bin/update-desktop-database ]; then
            update-desktop-database -q /usr/share/applications || true
          fi
          if [ -x /usr/bin/gtk-update-icon-cache ]; then
            gtk-update-icon-cache -q /usr/share/icons/hicolor || true
          fi
          exit 0
          EOF
          chmod 755 "$DEB_DIR/DEBIAN/postinst"

          dpkg-deb --build "$DEB_DIR" "glyph-${VERSION}.deb"

      - name: Build RPM Packages (.rpm)
        run: |
          VERSION="${PACKAGING_VERSION:?PACKAGING_VERSION was not set}"
          RPM_TOP="$HOME/rpmbuild"
          mkdir -p "$RPM_TOP"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

          # Quote heredoc so shell variables $d, $py_dir are preserved verbatim for rpmbuild
          cat <<'EOF' > "$RPM_TOP/SPECS/glyph.spec"
          Name:           glyph
          Version:        __VERSION__
          Release:        1%{?dist}
          Summary:        Customize application launcher icons and names on Linux
          License:        GPL-3.0-or-later
          URL:            https://github.com/the0megastar/Glyph
          BuildArch:      noarch
          Requires:       python3 >= 3.10, gtk4 >= 4.10, libadwaita >= 1.5, python3-gobject, desktop-file-utils

          %description
          A modern desktop utility for Linux to browse installed applications,
          customize launcher icons and display names safely at the user level,
          and easily restore system defaults.

          %install
          mkdir -p %{buildroot}
          cp -r __PKG_ROOT__/* %{buildroot}/
          for d in %{buildroot}/usr/lib/python*/dist-packages; do
            if [ -d "$d" ]; then
              py_dir=$(dirname "$d")
              mkdir -p "$py_dir/site-packages"
              cp -r "$d"/* "$py_dir/site-packages/"
            fi
          done

          %post
          /usr/bin/update-desktop-database &> /dev/null || :
          /usr/bin/gtk-update-icon-cache /usr/share/icons/hicolor &> /dev/null || :

          %files
          /usr/bin/glyph
          /usr/lib/python*
          /usr/share/applications/*.desktop
          /usr/share/metainfo/*.xml
          /usr/share/icons/hicolor/*
          EOF

          sed -i "s|__VERSION__|${VERSION}|g" "$RPM_TOP/SPECS/glyph.spec"
          sed -i "s|__PKG_ROOT__|$(pwd)/_pkg_root|g" "$RPM_TOP/SPECS/glyph.spec"

          rpmbuild -bb "$RPM_TOP/SPECS/glyph.spec"
          RPM_FILE=$(find "$RPM_TOP/RPMS" -name "*.rpm" | head -n 1)
          cp "$RPM_FILE" "glyph-${VERSION}.rpm"

      - name: Upload .deb & .rpm Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-packages
          path: |
            glyph-*.deb
            glyph-*.rpm

  build-appimage:
    name: Build AppImage (${{ matrix.arch }})
    needs: [validate-and-test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools & dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson \
            ninja-build \
            file \
            wget \
            libgtk-4-dev \
            libadwaita-1-dev \
            python3-gi \
            python3-gi-cairo \
            libgirepository1.0-dev

      - name: Build Real Runtime AppImage
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION=$(PYTHONPATH=src python3 -c "import glyph; print(glyph.__version__)")
          fi
          ARCH="${{ matrix.arch }}" VERSION="${VERSION}" ./scripts/build_appimage.sh

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage-${{ matrix.arch }}
          path: Glyph-*.AppImage

  publish-release:
    name: Publish Release Assets
    needs: [build-flatpak, build-deb-rpm, build-appimage]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Display Release Files
        run: |
          ls -lh release-assets/

      - name: Write Release Step Summary
        run: |
          echo "### 📦 Release Binaries Published" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Target | Architecture |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          for f in release-assets/*; do
            filename=$(basename "$f")
            echo "| \`$filename\` | Release Asset | Multi |" >> $GITHUB_STEP_SUMMARY
          done

      - name: Upload Release Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          body_path: docs/RELEASE_v0.1.3.md
          draft: false
          prerelease: false
          generate_release_notes: true
