name: Flathub PR 5-Month Milestone Reminder

on:
  schedule:
    # Runs at 14:00 UTC on February 1, 2027 (approx. 5 months from submission)
    - cron: '0 14 1 2 *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  notify-flathub-milestone:
    runs-on: ubuntu-latest
    steps:
      - name: Check and create reminder issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = '[Milestone] 5-Month Repo Track Record Reached — Update Flathub PR #10083';

            const issues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'all',
            });
            const existing = issues.data.find(issue => issue.title === title);
            if (existing) {
              console.log(`Reminder issue already exists: #${existing.number}`);
              return;
            }

            const body = [
              '## 🚀 Milestone Reached: 5 Months of Development History',
              '',
              `Hello @${owner}!`,
              '',
              'Glyph has now maintained an active, publicly visible open-source repository track record for **5 months**. The initial blocker regarding "insufficient development history" cited on [Flathub PR #10083](https://github.com/flathub/flathub/pull/10083) is now satisfied.',
              '',
              '### 📋 Checklist Before Requesting Re-Review:',
              '- [ ] **Human-Crafted Vector Icon:** Confirm the application icon was designed by you or commissioned from an artist (zero AI generation).',
              '- [ ] **AI Disclosure:** Confirm disclosure in the PR and metainfo is set to `None`.',
              '- [ ] **Manifest Update:** Ensure the Flathub PR manifest points to the latest release tag and commit hash.',
              '- [ ] **Request Review:** Comment on [flathub/flathub#10083](https://github.com/flathub/flathub/pull/10083) asking the team to unblock and review the technical merits of Glyph.',
              '',
              '*Automated reminder scheduled by Glyph CI/CD.*'
            ].join('\n');

            const newIssue = await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels: ['flathub', 'milestone'],
              assignees: [owner]
            });
            console.log(`Created milestone reminder issue: #${newIssue.data.number}`);
