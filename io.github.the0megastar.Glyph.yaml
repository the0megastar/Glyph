app-id: io.github.the0megastar.Glyph
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: glyph

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.freedesktop.Flatpak
  - --filesystem=xdg-data/applications:create
  - --filesystem=xdg-data/glyph:create
  - --filesystem=host-os:ro
  - --filesystem=/var/lib/flatpak:ro
  - --filesystem=xdg-data/flatpak:ro
  - --filesystem=xdg-data/icons:ro

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - '*.la'
  - '*.a'

modules:
  - name: glyph
    buildsystem: meson
    sources:
      - type: dir
        path: .
