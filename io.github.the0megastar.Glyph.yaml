app-id: io.github.the0megastar.Glyph
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: glyph

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=xdg-data/applications:create
  # Scoped access to user's Applications directory for AppImage registration and management
  - --filesystem=~/Applications:create
  # Scoped read-only access to host user's icon theme directories
  - --filesystem=xdg-data/icons:ro
  - --filesystem=~/.icons:ro
  - --filesystem=host-os:ro
  - --filesystem=/var/lib/flatpak/exports/share:ro
  - --filesystem=/var/lib/flatpak/app:ro
  - --filesystem=xdg-data/flatpak/exports/share:ro
  - --filesystem=xdg-data/flatpak/app:ro
  # Broad host command capability enabling flatpak-spawn --host to launch external desktop
  # applications as the logged-in host user. This permission allows requesting arbitrary
  # commands as the host user and is not a security boundary against compromised sandbox code.
  - --talk-name=org.freedesktop.Flatpak

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - '*.la'
  - '*.a'

modules:
  - name: glyph
    buildsystem: meson
    sources:
      - type: dir
        path: .
