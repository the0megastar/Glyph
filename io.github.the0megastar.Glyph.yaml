app-id: io.github.the0megastar.Glyph
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: glyph

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=xdg-data/applications:create
  - --filesystem=/var/lib/flatpak/exports/share:ro
  - --filesystem=/var/lib/flatpak/app:ro
  - --filesystem=xdg-data/flatpak/exports/share:ro
  - --filesystem=xdg-data/flatpak/app:ro

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - '*.la'
  - '*.a'

modules:
  - name: glyph
    buildsystem: meson
    sources:
      - type: dir
        path: .
